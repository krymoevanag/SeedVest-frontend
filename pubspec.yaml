name: seedvest_mobile
description: SeedVest Mobile Application
publish_to: 'none'

version: 1.0.1+2

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  provider: ^6.1.2
  flutter_secure_storage: ^10.0.0
  fl_chart: ^1.1.1
  google_fonts: ^8.0.1
  intl: ^0.20.2
  flutter_dotenv: ^6.0.0
  connectivity_plus: ^7.0.0
  crypto: ^3.0.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  app_links: ^6.1.1
  permission_handler: ^13.0.1
  image_picker: ^1.1.2
  local_auth: ^3.0.1
  url_launcher: ^6.3.1
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Testing
  mockito: ^5.4.4
  build_runner: ^2.4.13

  # Hive code generation
  hive_generator: ^2.0.1
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/seedvest_app_icon.png"
  adaptive_icon_background: "#1B5E20"
  adaptive_icon_foreground: "assets/icons/seedvest_app_icon.png"

flutter:
  uses-material-design: true

  assets:
    - .env
