# Enable build cache
org.gradle.caching=true
# Enable parallel execution
org.gradle.parallel=true
# Enable Gradle daemon
org.gradle.daemon=true

org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false

# Fix: Kotlin incremental compilation breaks on Windows when pub cache (C:\)
# and project (D:\) are on different drives — relative path computation fails.
kotlin.incremental=false
